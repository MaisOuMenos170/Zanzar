name: Zanzar CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: "0.65.1"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      - name: Choose simulator
        id: simulator
        run: |
          destination=$(./scripts/select-ios-simulator.sh)
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "Using $destination"

      - name: Create Config.xcconfig
        run: |
          cat > ZanzarProject/Config.xcconfig <<EOF
          ZANZAR_API_BASE_URL = http://127.0.0.1:3000
          EOF

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project ./ZanzarProject/ZanzarProject.xcodeproj -scheme ZanzarProject -destination "${{ steps.simulator.outputs.destination }}" test
