name: Selo e tradução

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  content:
    name: Conferir selo e strings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Conferir
        run: node scripts/check-app-content.mjs
